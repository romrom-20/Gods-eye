[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godseye-wsp"
version = "0.3.0"
description = "A reproducible workbench for direct weight-space programming"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "God's Eye contributors"}]
dependencies = ["numpy==2.0.2", "MinAtar==1.0.15"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["godseye-wsp[server]", "httpx>=0.27,<1", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
godseye = "godseye.__main__:main"
godseye-benchmark = "godseye.benchmark_cli:main"

[project.urls]
Repository = "https://github.com/romrom-20/Gods-eye"
Issues = "https://github.com/romrom-20/Gods-eye/issues"

[tool.setuptools.packages.find]
include = ["godseye*"]

[tool.setuptools.package-data]
godseye = ["static/*", "data/breakout/*", "data/presets/*", "data/demo/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
